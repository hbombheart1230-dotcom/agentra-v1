name: RF task ledger sync
on:
  workflow_dispatch:
  push:
    branches: [integration/p1.5]
    paths:
      - 'docs/refactor/plan/rf_details/**'
      - 'docs/refactor/plan/ledger_parts/**'
      - 'docs/refactor/plan/STATUS.md'
      - '.github/workflows/rf-task-ledger.yml'
      - 'docs/refactor/plan/tools/merge_rf_ledger_parts.py'
      - 'docs/refactor/plan/tools/export_rf_ledger_xlsx.py'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/p1.5
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate JSON ledger from all RF designs
        run: python docs/refactor/plan/tools/merge_rf_ledger_parts.py
      - name: Install spreadsheet exporter
        run: python -m pip install artifact-tool
      - name: Export Excel dashboard
        run: python docs/refactor/plan/tools/export_rf_ledger_xlsx.py
      - name: Check JSON schema and task IDs
        run: |
          python - <<'PY'
          import json
          p='docs/refactor/plan/RF_TASK_LEDGER.json'
          data=json.load(open(p,encoding='utf-8'))
          assert len(data['rf'])==93, f"expected 93 RF, got {len(data['rf'])}"
          ids=[t['task_id'] for rf in data['rf'] for t in rf['tasks']]
          assert len(ids)==len(set(ids)), "duplicate task IDs"
          print(f"validated RF={len(data['rf'])} tasks={len(ids)}")
          PY
      - name: Commit generated ledger
        run: |
          if [ -n "$(git status --porcelain -- docs/refactor/plan/RF_TASK_LEDGER.json docs/refactor/plan/RF_TASK_LEDGER.xlsx)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/refactor/plan/RF_TASK_LEDGER.json docs/refactor/plan/RF_TASK_LEDGER.xlsx
            git commit -m 'docs(plan): refresh RF JSON task ledger [skip ci]'
            git push origin HEAD:integration/p1.5
          fi
